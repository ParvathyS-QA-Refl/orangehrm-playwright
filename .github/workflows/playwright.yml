name: Playwright Tests
on:
  # Automatic runs: every push/PR to main runs ALL tests on the qa environment
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # Manual runs: adds a "Run workflow" button on the Actions tab
  workflow_dispatch:
    inputs:
      environment:
        description: 'Which environment to test (picks config/.env.<name>)'
        type: choice
        options: [ qa, staging ]
        default: qa
      tag:
        description: 'Only run tests with this tag, e.g. @smoke (leave empty = all tests)'
        type: string
        required: false
        default: ''
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    # Only Chromium is used, so install just that browser (faster)
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
    # Catch TypeScript mistakes (wrong types, typos) before spending time on browser tests
    - name: Type check
      run: npm run typecheck
    - name: Run Playwright tests
      # If a tag was given, add --grep "<tag>"; otherwise run everything.
      # The tag is read from an env variable (not pasted into the script) so odd input can't break the command.
      run: |
        if [ -n "$TEST_TAG" ]; then
          npx playwright test --grep "$TEST_TAG"
        else
          npx playwright test
        fi
      env:
        # Which config/.env.<name> to use. Push/PR runs have no inputs, so they fall back to qa.
        # The env file is not in Git, so the values come from below.
        TEST_ENV: ${{ inputs.environment || 'qa' }}
        TEST_TAG: ${{ inputs.tag }}
        # The URL is public, so it is a plain value, not a secret (qa and staging both use the demo site)
        BASE_URL: https://opensource-demo.orangehrmlive.com
        # Credentials come from GitHub repository secrets (Settings > Secrets and variables > Actions)
        ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
        ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    # HTML report: uploaded on every run (pass or fail), unless the run was cancelled
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    # Raw failure evidence (traces, videos, screenshots): only needed when something failed
    - uses: actions/upload-artifact@v7
      if: ${{ failure() }}
      with:
        name: test-results
        path: test-results/
        retention-days: 30
